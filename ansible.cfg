# Global Ansible Configuration for Practice Repository
[defaults]
# Use local inventory by default
inventory = ./lab/inventory.ini

# Roles and collections paths
roles_path = ./roles:./exercises/10-role-architecture/roles:./exercises/11-multitier-application-stack/roles:~/.ansible/roles:/etc/ansible/roles
collections_path = ./collections:~/.ansible/collections

# Output formatting
stdout_callback = default
result_format = yaml
callbacks_enabled = timer, profile_tasks

# Disable host key checking for local lab containers / test VMs
host_key_checking = False

# Safe temporary directories (macOS / Linux sandbox friendly)
local_tmp = /tmp/ansible-local
remote_tmp = /tmp/ansible-remote

# Retry files
retry_files_enabled = False

# Python interpreter discovery
interpreter_python = auto_silent

# Default forks for parallel execution
forks = 5

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
