---
# Starter Playbook: CIS Security Hardening
- name: Apply CIS Security Hardening Baseline
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    hardening_root: /tmp/compliance_lab

  tasks:
    - name: Prepare hardening lab directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ hardening_root }}"
        - "{{ hardening_root }}/ssh"
        - "{{ hardening_root }}/sysctl"
        - "{{ hardening_root }}/secure_keys"

