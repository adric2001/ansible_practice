---
# Reference Solution: Ansible Vault Integration
- name: Deploy Application with Vault Secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vault_secret.yml

  vars:
    app_target_dir: /tmp/ansible_vault_lab

  tasks:
    - name: 1. Ensure target directory exists with strict permissions
      ansible.builtin.file:
        path: "{{ app_target_dir }}"
        state: directory
        mode: '0700'

    - name: 2. Render environment configuration with decrypted secrets
      ansible.builtin.copy:
        dest: "{{ app_target_dir }}/payment_service.env"
        mode: '0600'
        content: |
          # Generated by Ansible with Vault Decryption
          PAYMENT_API_KEY="{{ payment_gateway_api_key }}"
          DATABASE_PASSWORD="{{ database_master_password }}"
          JWT_SECRET="{{ jwt_signing_key }}"
          DECRYPTED_TIMESTAMP="{{ lookup('pipe', 'date') }}"

    - name: 3. Verify secrets rendered without disclosing them to logs
      ansible.builtin.stat:
        path: "{{ app_target_dir }}/payment_service.env"
      register: env_file
      failed_when: not env_file.stat.exists

    - name: 4. Assert secrets were correctly decrypted inside the file
      ansible.builtin.command:
        cmd: "grep 'sk_live_998877665544332211' {{ app_target_dir }}/payment_service.env"
      register: secret_check
      changed_when: false

    - name: 5. Display success confirmation (masking sensitive values)
      ansible.builtin.debug:
        msg: "Vault successfully decrypted! API Key length: {{ payment_gateway_api_key | length }} characters."

