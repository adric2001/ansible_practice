# Solution Inventory (INI Format)
localhost ansible_connection=local

[web_prod]
web-prod-01 ansible_host=192.168.10.11 ansible_port=22 ansible_user=deploy
web-prod-02 ansible_host=192.168.10.12 ansible_port=22 ansible_user=deploy

[web_stage]
web-stage-01 ansible_host=192.168.20.11 ansible_port=2222 ansible_user=stageuser

[db_prod]
db-prod-primary ansible_host=192.168.10.50 ansible_port=22 db_role=primary
db-prod-replica ansible_host=192.168.10.51 ansible_port=22 db_role=replica

[db_stage]
db-stage-01 ansible_host=192.168.20.50 ansible_port=22 db_role=standalone

[bastion]
bastion-01 ansible_host=10.0.0.1 ansible_port=2200

# Parent group: web
[web:children]
web_prod
web_stage

# Parent group: databases
[databases:children]
db_prod
db_stage

# Parent group: production
[production:children]
web_prod
db_prod

# Parent group: staging
[staging:children]
web_stage
db_stage

# Group Variables
[all:vars]
ntp_server=pool.ntp.org

[web:vars]
http_port=80

[production:vars]
env_type=production
monitoring_enabled=true

[staging:vars]
env_type=staging
monitoring_enabled=false

