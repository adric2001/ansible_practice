---
# Tasks for common_security role
- name: Ensure security target directory exists
  ansible.builtin.file:
    path: "{{ security_base_dir }}"
    state: directory
    mode: '0755'

- name: Deploy static security banner
  ansible.builtin.copy:
    src: banner.txt
    dest: "{{ security_base_dir }}/security_banner.txt"
    mode: '0644'
  when: security_banner_enabled | bool

- name: Render dynamic security audit configuration
  ansible.builtin.template:
    src: audit.conf.j2
    dest: "{{ security_base_dir }}/audit.conf"
    mode: '0640'

- name: Record role execution summary
  ansible.builtin.debug:
    msg: "common_security role applied successfully! Level: {{ security_audit_level }}"

