# Lab Inventory (YAML Format)
all:
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    environment_name: lab
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    production:
      children:
        webservers:
          hosts:
            web01:
              ansible_host: 127.0.0.1
              ansible_port: 2221
              ansible_user: ansible
              ansible_ssh_private_key_file: ./lab/ssh_keys/id_rsa
            web02:
              ansible_host: 127.0.0.1
              ansible_port: 2222
              ansible_user: ansible
              ansible_ssh_private_key_file: ./lab/ssh_keys/id_rsa
        dbservers:
          hosts:
            db01:
              ansible_host: 127.0.0.1
              ansible_port: 2223
              ansible_user: ansible
              ansible_ssh_private_key_file: ./lab/ssh_keys/id_rsa
