# Lab Inventory (INI Format)
# Use this when running practice exercises against Docker containers or localhost.

# Localhost target (Runs directly on your machine without Docker)
[local]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"

# Docker Lab Nodes (Active when lab containers are running via docker-compose)
[webservers]
web01 ansible_host=127.0.0.1 ansible_port=2221 ansible_user=ansible ansible_ssh_private_key_file=./lab/ssh_keys/id_rsa
web02 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ansible ansible_ssh_private_key_file=./lab/ssh_keys/id_rsa

[dbservers]
db01 ansible_host=127.0.0.1 ansible_port=2223 ansible_user=ansible ansible_ssh_private_key_file=./lab/ssh_keys/id_rsa

# Group of groups (Children)
[production:children]
webservers
dbservers

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
environment_name=lab
